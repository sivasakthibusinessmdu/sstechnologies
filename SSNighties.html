<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SS Nighties</title>
  <style>
     /* Barcode container in top-right */
    .barcode-container {
      position: fixed;   /* stays in top-right even when scrolling */
      top: 20px;
      right: 20px;
      text-align: center;
    }

    .barcode-container img {
      height: 100px;     /* adjust barcode size */
      width: auto;
      display: block;
      margin: 0 auto;
    }

    .barcode-container p {
      margin-top: 5px;
      font-size: 14px;
      font-weight: bold;
      color: #8b0000;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #fdfcfb, #e2d1c3);
      min-height: 100vh;
    }

    .title-container {
      text-align: center;
      background: #fff;
      padding: 40px 60px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: fadeIn 2s ease-in-out;
      margin: 30px auto;
      max-width: 800px;
    }

    .title-container h1 {
      font-size: 42px;
      color: #8b0000;
      margin-bottom: 15px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.2);
    }

    .title-container h2 {
      font-size: 24px;
      color: #8b0000;
      font-weight: normal;
      letter-spacing: 1px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin: 40px;
    }

    .product {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      text-align: center;
      width: 220px;
    }

    .product img {
      width: 100%;
      height: 580px;       /* 👈 set a fixed height */
  object-fit: cover;   /* 👈 crop/scale nicely without distortion */
            border-radius: 8px;
      margin-bottom: 15px;
    }

    .amazon-btn {
      display: inline-block;
      background: linear-gradient(135deg, #FF9900, #FF6600);
      color: white;
      font-size: 18px;
      font-weight: bold;
      padding: 12px 25px;
      border: none;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .amazon-btn:hover {
      background: linear-gradient(135deg, #FF6600, #CC5200);
      transform: translateY(-3px);
      box-shadow: 0 12px 20px rgba(0,0,0,0.3);
    }

    .amazon-btn:active {
      transform: translateY(1px);
      box-shadow: 0 6px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="barcode-container">
    <img src="DonateBarcode.jpeg" alt="Barcode">
    <p>Invest, Earn, Donate</p>
  </div>
  <div class="title-container">
    <h1>Welcome to <img src="SSNighties_Brand_Image.jpeg" alt="SS Nighties"></h1>
    <h2>A Unit of SivaSakthi Business</h2>
  </div>

  <div style="text-align:center;">
    <h1>Shop SS Nighties on Amazon</h1>
    <p>Click the button below each product to buy</p>
  </div>

  <div class="gallery">
    <div class="product">
      <img src="Design_1.jpg" alt="SS Nightie Floral Design">
      <a href="https://www.amazon.in/dp/B0HBQBRGT7" target="_blank" class="amazon-btn">🛒 Buy on Amazon</a>
    </div>
    <div class="product">
      <img src="Design_2.jpg" alt="SS Nightie Cotton Comfort">
      <a href="https://www.amazon.in/dp/B0HBWVQGRS" target="_blank" class="amazon-btn">🛒 Buy on Amazon</a>
    </div>
    <div class="product">
      <img src="Design_3.jpg" alt="SS Nightie Premium Silk">
      <a href="https://www.amazon.in/dp/B0HBR9NYB9" target="_blank" class="amazon-btn">🛒 Buy on Amazon</a>
    </div>
    <div class="product">
      <img src="Design_4.jpg" alt="SS Nightie Trendy Prints">
      <a href="https://www.amazon.in/dp/B0HBQHK5X4" target="_blank" class="amazon-btn">🛒 Buy on Amazon</a>
    </div>
  </div>

</body>
</html>
